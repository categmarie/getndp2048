
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GET NDP 💗</title>

<style>
:root {
  --pink: #f5a6cf;
  --dark-pink: #d84e99;
  --cell: #f9dce9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 12px;
  background: linear-gradient(135deg, #fff4fa, #f9d9eb);
  color: #8f2863;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

h1 {
  margin: 4px 0;
  font-size: clamp(38px, 8vw, 60px);
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle { margin: 8px 0 18px; }

.top {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.score {
  background: white;
  border-radius: 12px;
  padding: 10px 18px;
  min-width: 95px;
  font-weight: bold;
  box-shadow: 0 3px 10px #d77eaa33;
}

.score small {
  display: block;
  font-size: 11px;
  letter-spacing: 1px;
  color: #b45b8a;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 12px 17px;
  background: var(--dark-pink);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover { filter: brightness(1.05); }

#board {
  position: relative;
  width: min(92vw, 430px);
  aspect-ratio: 1;
  margin: 0 auto;
  padding: 10px;
  background: #eeb5d1;
  border-radius: 17px;
  box-shadow: 0 8px 24px #b65c8d33;
  overflow: hidden;
  touch-action: none;
}

#cells {
  position: absolute;
  inset: 10px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 9px;
}

.cell {
  background: var(--cell);
  border-radius: 10px;
}

#tiles {
  position: absolute;
  inset: 10px;
  pointer-events: none;
}

.tile {
  position: absolute;
  left: 0;
  top: 0;
  width: calc((100% - 27px) / 4);
  height: calc((100% - 27px) / 4);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  padding: 4px;
  background: white;
  box-shadow: 0 3px 8px #a9437830;
  transform: translate(0, 0);
  transition: transform 160ms ease-in-out;
  will-change: transform;
}

.tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 7px;
  pointer-events: none;
}

.tile.spawn {
  animation: appear 140ms ease-out;
}

.tile.merge {
  animation: mergePop 180ms ease-out;
}

@keyframes appear {
  from { opacity: .6; scale: .75; }
  to { opacity: 1; scale: 1; }
}

@keyframes mergePop {
  0% { scale: 1; }
  55% { scale: 1.12; }
  100% { scale: 1; }
}

.message {
  min-height: 24px;
  margin: 14px 0 8px;
  font-weight: bold;
}

.instructions {
  max-width: 430px;
  margin: 12px auto;
  line-height: 1.5;
  font-size: 14px;
}

footer {
  margin-top: 25px;
  font-size: 12px;
  color: #a24a7a;
}

@media (prefers-reduced-motion: reduce) {
  .tile { transition-duration: 1ms; }
}
</style>
</head>

<body>
  <h1>GET NDP</h1>
  <p class="subtitle">merge the schools 💗</p>

  <div class="top">
    <div class="score">
      <small>SCORE</small>
      <span id="score">0</span>
    </div>
    <div class="score">
      <small>BEST</small>
      <span id="best">0</span>
    </div>
    <button id="restart">New Game ↻</button>
  </div>

  <div id="board" aria-label="GET NDP game board">
    <div id="cells"></div>
    <div id="tiles"></div>
  </div>

  <div class="message" id="message"></div>

  <p class="instructions">
    Use your arrow keys or swipe to move the logos.
    Merge matching schools to work your way up to NDP!
  </p>

  <footer>Created by Cate Graham</footer>

<script>
(() => {
  const schools = [
    { name: "St. Ursula's", file: "images_sus.jpg" },
    { name: "ICS", file: "ICS-Logo.jpg" },
    { name: "St. Philip Neri", file: "images_spn.png" },
    { name: "Maryvale", file: "images_maryvale.jpg" },
    { name: "Catholic High", file: "images.jpg" },
    { name: "Bryn Mawr", file: "bryn-mawr-school.jpg" },
    { name: "RCPS", file: "Rpcs_logo2.png" },
    { name: "John Carroll", file: "The_John_Carroll_School_Logo.jpeg" },
    { name: "Mercy", file: "MHS_Seal_ONLY.jpg" },
    { name: "Mount de Sales", file: "Mount_de_Sales_Academy_Logo.png" },
    { name: "NDP", file: "images_ndp.jpg" }
  ];

  const SIZE = 4;
  const MOVE_TIME = 160;

  const boardEl = document.getElementById("board");
  const tilesEl = document.getElementById("tiles");
  const cellsEl = document.getElementById("cells");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const messageEl = document.getElementById("message");

  let board = [];
  let score = 0;
  let best = Number(localStorage.getItem("getNdpBest") || 0);
  let nextId = 1;
  let busy = false;
  let touchStart = null;
  let resizeTimer;

  bestEl.textContent = best;

  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cellsEl.appendChild(cell);
  }

  function emptyBoard() {
    return Array.from({ length: SIZE }, () =>
      Array(SIZE).fill(null)
    );
  }

  function makeTile(level, row, col) {
    return { id: nextId++, level, row, col };
  }

  function addRandomTile() {
    const empty = [];

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!board[r][c]) empty.push([r, c]);
      }
    }

    if (!empty.length) return;

    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const level = Math.random() < 0.9 ? 1 : 2;
    board[r][c] = makeTile(level, r, c);
  }

  function cellSize() {
    return (tilesEl.clientWidth - 27) / 4;
  }

  function positionFor(row, col) {
    const step = cellSize() + 9;
    return `translate(${col * step}px, ${row * step}px)`;
  }

  function createElement(tile, row, col, animateSpawn = true) {
    const el = document.createElement("div");
    el.className = "tile";
    el.dataset.id = tile.id;
    el.dataset.level = tile.level;

    const img = document.createElement("img");
    img.alt = schools[tile.level - 1].name;
    img.draggable = false;
    img.src = "logos/" + schools[tile.level - 1].file;

    img.onerror = () => {
      el.title = "Logo image not found: " + img.src;
      el.style.border = "2px dashed #d84e99";
    };

    el.appendChild(img);
    tilesEl.appendChild(el);

    // IMPORTANT: position the element BEFORE enabling transitions.
    // This prevents a new tile from animating out of the top-left corner.
    el.style.transition = "none";
    el.style.transform = positionFor(row, col);
    void el.offsetWidth;
    el.style.transition = "";

    if (animateSpawn) {
      el.classList.add("spawn");
      el.addEventListener("animationend", () => {
        el.classList.remove("spawn");
      }, { once: true });
    }

    return el;
  }

  function render() {
    const existing = new Map(
      [...tilesEl.querySelectorAll(".tile")].map(el => [
        Number(el.dataset.id), el
      ])
    );

    const liveIds = new Set();

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = board[r][c];
        if (!tile) continue;

        liveIds.add(tile.id);

        let el = existing.get(tile.id);

        if (!el) {
          el = createElement(tile, r, c);
        } else {
          el.style.transform = positionFor(r, c);
          updateLogo(el, tile.level);
        }

        el.title = schools[tile.level - 1].name;
      }
    }

    for (const [id, el] of existing) {
      if (!liveIds.has(id)) el.remove();
    }

    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function updateLogo(el, level) {
    if (Number(el.dataset.level) === level) return;

    const img = el.querySelector("img");
    img.src = "logos/" + schools[level - 1].file;
    img.alt = schools[level - 1].name;
    el.dataset.level = level;
    el.title = schools[level - 1].name;
  }

  function move(direction) {
    if (busy) return;

    const before = board.map(row =>
      row.map(tile => tile ? { ...tile } : null)
    );

    const next = emptyBoard();
    let gained = 0;
    let changed = false;
    const mergedIds = new Set();

    for (let line = 0; line < SIZE; line++) {
      const coords = [];

      for (let i = 0; i < SIZE; i++) {
        let r, c;

        if (direction === "left") {
          r = line; c = i;
        } else if (direction === "right") {
          r = line; c = SIZE - 1 - i;
        } else if (direction === "up") {
          r = i; c = line;
        } else {
          r = SIZE - 1 - i; c = line;
        }

        coords.push([r, c]);
      }

      const packed = coords
        .map(([r, c]) => board[r][c])
        .filter(Boolean);

      const result = [];

      for (let i = 0; i < packed.length; i++) {
        const current = packed[i];
        const following = packed[i + 1];

        if (
          following &&
          current.level === following.level &&
          current.level < schools.length
        ) {
          // Keep the first tile's ID so its existing element slides.
          result.push({
            id: current.id,
            level: current.level + 1,
            row: 0,
            col: 0
          });

          mergedIds.add(current.id);
          gained += Math.pow(2, current.level);
          i++;
        } else {
          result.push({
            id: current.id,
            level: current.level,
            row: 0,
            col: 0
          });
        }
      }

      result.forEach((tile, i) => {
        const [r, c] = coords[i];
        tile.row = r;
        tile.col = c;
        next[r][c] = tile;
      });
    }

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const a = before[r][c];
        const b = next[r][c];

        if (
          (!a && b) ||
          (a && !b) ||
          (a && b && (a.id !== b.id || a.level !== b.level))
        ) {
          changed = true;
        }
      }
    }

    if (!changed) return;

    /*
      Keep existing DOM elements during the move.
      Move survivors first; update merged logos only after the slide.
    */
    const oldLevels = new Map();
    before.flat().forEach(tile => {
      if (tile) oldLevels.set(tile.id, tile.level);
    });

    busy = true;
    board = next;

    const liveIds = new Set(
      board.flat().filter(Boolean).map(tile => tile.id)
    );

    // Remove consumed merge partners, but never recreate survivors.
    for (const el of [...tilesEl.querySelectorAll(".tile")]) {
      if (!liveIds.has(Number(el.dataset.id))) el.remove();
    }

    // Move all surviving tiles using their existing elements.
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = board[r][c];
        if (!tile) continue;

        let el = tilesEl.querySelector(
          `[data-id="${tile.id}"]`
        );

        // Existing survivors should already have elements.
        // If an element is missing, place it at its destination safely.
        if (!el) {
          el = createElement(
            { ...tile, level: oldLevels.get(tile.id) || tile.level },
            r, c, false
          );
        }

        // Keep the old logo visible during the slide.
        el.style.transform = positionFor(r, c);
      }
    }

    score += gained;

    if (score > best) {
      best = score;
      localStorage.setItem("getNdpBest", String(best));
    }

    scoreEl.textContent = score;
    bestEl.textContent = best;

    window.setTimeout(() => {
      // Switch to the new logo after the slide completes.
      for (const row of board) {
        for (const tile of row) {
          if (!tile) continue;

          const el = tilesEl.querySelector(
            `[data-id="${tile.id}"]`
          );

          if (!el) continue;

          updateLogo(el, tile.level);

          if (mergedIds.has(tile.id)) {
            el.classList.add("merge");
            el.addEventListener("animationend", () => {
              el.classList.remove("merge");
            }, { once: true });
          }
        }
      }

      addRandomTile();
      render();
      busy = false;
      checkGameState();
    }, MOVE_TIME);
  }

  function checkGameState() {
    const won = board.some(row =>
      row.some(tile => tile && tile.level === schools.length)
    );

    if (won) {
      messageEl.textContent = "YOU GOT NDP!! 💗";
      return;
    }

    const full = board.every(row => row.every(Boolean));

    if (!full) {
      messageEl.textContent = "";
      return;
    }

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = board[r][c];

        if (
          (r + 1 < SIZE && board[r + 1][c].level === tile.level) ||
          (c + 1 < SIZE && board[r][c + 1].level === tile.level)
        ) {
          messageEl.textContent = "";
          return;
        }
      }
    }

    messageEl.textContent = "Game over! Tap New Game to play again.";
  }

  function restart() {
    board = emptyBoard();
    score = 0;
    nextId = 1;
    busy = false;
    messageEl.textContent = "";
    tilesEl.innerHTML = "";

    addRandomTile();
    addRandomTile();
    render();
  }

  document.getElementById("restart").addEventListener("click", restart);

  document.addEventListener("keydown", event => {
    const directions = {
      ArrowLeft: "left",
      ArrowRight: "right",
      ArrowUp: "up",
      ArrowDown: "down"
    };

    if (directions[event.key]) {
      event.preventDefault();
      move(directions[event.key]);
    }
  });

  boardEl.addEventListener("touchstart", event => {
    const t = event.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener("touchend", event => {
    if (!touchStart) return;

    const t = event.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? "right" : "left");
    } else {
      move(dy > 0 ? "down" : "up");
    }
  }, { passive: true });

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(() => {
      // Avoid repositioning tiles in the middle of an animation.
      if (!busy) render();
    });
    observer.observe(boardEl);
  } else {
    window.addEventListener("resize", () => {
      if (!busy) render();
    });
  }

  restart();
})();
</script>
</body>
</html>
