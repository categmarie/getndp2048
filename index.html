<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GET NDP</title>

<style>
:root {
  --pink: #ed83b5;
  --dark-pink: #d84d91;
  --light-pink: #fff0f7;
  --empty: #f5d9e7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 12px;
  background: linear-gradient(135deg, #fff5fa, #f9d8e9);
  color: #7c2853;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 0;
  color: #d84d91;
  font-size: clamp(38px, 9vw, 62px);
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle {
  margin: 5px 0 18px;
  color: #985075;
}

.top {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 0 auto 16px;
}

.score {
  min-width: 85px;
  padding: 10px 16px;
  background: white;
  border-radius: 12px;
  font-weight: bold;
}

.score span {
  display: block;
  color: #d84d91;
  font-size: 22px;
}

button {
  border: 0;
  padding: 12px 17px;
  border-radius: 12px;
  background: #d84d91;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #bd3679; }

#board {
  --gap: 9px;
  position: relative;
  width: min(92vw, 430px);
  aspect-ratio: 1;
  margin: 0 auto;
  padding: var(--gap);
  border-radius: 17px;
  background: #e8a5c7;
  box-shadow: 0 8px 24px #a8447730;
  touch-action: none;
}

.cells {
  position: absolute;
  inset: var(--gap);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--gap);
}

.cell {
  min-width: 0;
  min-height: 0;
  border-radius: 10px;
  background: var(--empty);
}

#tiles {
  position: absolute;
  inset: var(--gap);
  pointer-events: none;
}

.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 5px;
  border-radius: 10px;
  background: white;
  box-shadow: 0 2px 5px #84345b18;
  transition: transform 160ms ease-in-out;
  will-change: transform;
}

.tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 5px;
}

.tile.new {
  animation: appear 140ms ease-out;
}

@keyframes appear {
  from { opacity: .45; scale: .8; }
  to { opacity: 1; scale: 1; }
}

.message {
  margin: 16px auto 8px;
  font-weight: bold;
  min-height: 20px;
}

.help {
  max-width: 350px;
  margin: 10px auto;
  color: #985075;
  font-size: 13px;
  line-height: 1.5;
}

.credit {
  margin-top: 20px;
  color: #a56c8b;
  font-size: 11px;
}

@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .tile.new { animation: none; }
}
</style>
</head>

<body>
<h1>GET NDP</h1>
<p class="subtitle">merge the schools. get to NDP 💗</p>

<div class="top">
  <div class="score">SCORE <span id="score">0</span></div>
  <button id="restart">New Game ↻</button>
</div>

<div id="board" aria-label="2048 school logo game">
  <div class="cells" id="cells"></div>
  <div id="tiles"></div>
</div>

<div class="message" id="message"></div>
<p class="help">
  Use your arrow keys to move the tiles, or swipe on the board.
  Match two of the same school to combine them!
</p>

<div class="credit">Created by Cate Graham</div>

<script>
const SIZE = 4;

const schools = [
  { name: "St. Ursula's", image: "logos/images_sus.jpg" },
  { name: "ICS", image: "logos/ICS-Logo.jpg" },
  { name: "St. Philip Neri", image: "logos/images_spn.png" },
  { name: "Maryvale", image: "logos/images_maryvale.jpg" },
  { name: "Catholic High", image: "logos/images.jpg" },
  { name: "Bryn Mawr", image: "logos/bryn-mawr-school.jpg" },
  { name: "RCPS", image: "logos/Rpcs_logo2.png" },
  { name: "John Carroll", image: "logos/The_John_Carroll_School_Logo.jpeg" },
  { name: "Mercy", image: "logos/MHS_Seal_ONLY.jpg" },
  { name: "Mount de Sales", image: "logos/Mount_de_Sales_Academy_Logo.png" },
  { name: "NDP", image: "logos/images_ndp.jpg" }
];

const board = document.getElementById("board");
const tilesLayer = document.getElementById("tiles");
const cellsLayer = document.getElementById("cells");
const scoreDisplay = document.getElementById("score");
const message = document.getElementById("message");

let grid = [];
let score = 0;
let nextId = 1;
let tileElements = new Map();
let gameOver = false;
let won = false;

for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cellsLayer.appendChild(cell);
}

function dimensions() {
  const gap = parseFloat(getComputedStyle(board).getPropertyValue("--gap")) || 9;
  const width = tilesLayer.clientWidth;
  const tileSize = (width - gap * (SIZE - 1)) / SIZE;
  return { tileSize, gap };
}

function positionTile(el, index) {
  const { tileSize, gap } = dimensions();
  const row = Math.floor(index / SIZE);
  const col = index % SIZE;

  el.style.width = tileSize + "px";
  el.style.height = tileSize + "px";
  el.style.transform =
    `translate(${col * (tileSize + gap)}px, ${row * (tileSize + gap)}px)`;
}

function makeTile(level) {
  return { id: nextId++, level };
}

function addRandomTile() {
  const empty = [];
  grid.forEach((tile, index) => {
    if (!tile) empty.push(index);
  });

  if (!empty.length) return;

  const index = empty[Math.floor(Math.random() * empty.length)];
  grid[index] = makeTile(Math.random() < 0.9 ? 1 : 2);
}

function render() {
  const activeIds = new Set();

  grid.forEach((tile, index) => {
    if (!tile) return;

    activeIds.add(tile.id);
    let el = tileElements.get(tile.id);

    if (!el) {
      el = document.createElement("div");
      el.className = "tile";

      const img = document.createElement("img");
      img.alt = "";
      img.draggable = false;
      el.appendChild(img);

      img.src = schools[tile.level - 1].image;
      img.onerror = () => {
        img.alt = "Logo unavailable";
      };

      tilesLayer.appendChild(el);
      tileElements.set(tile.id, el);

      // Newly created tiles appear in place; existing tiles slide.
      el.dataset.positioned = "false";
      el.classList.add("new");
    }

    const img = el.querySelector("img");
    const desiredImage = schools[tile.level - 1].image;

    if (img.getAttribute("src") !== desiredImage) {
      img.src = desiredImage;
    }

    positionTile(el, index);
    el.dataset.positioned = "true";
  });

  for (const [id, el] of tileElements) {
    if (!activeIds.has(id)) {
      el.remove();
      tileElements.delete(id);
    }
  }

  scoreDisplay.textContent = score;
}

function slideLine(line) {
  const values = line.filter(Boolean);
  const result = [];
  let gained = 0;

  for (let i = 0; i < values.length; i++) {
    if (i + 1 < values.length &&
        values[i].level === values[i + 1].level) {
      const merged = makeTile(values[i].level + 1);
      result.push(merged);
      gained += Math.pow(2, merged.level);
      i++;
    } else {
      result.push(values[i]);
    }
  }

  while (result.length < SIZE) result.push(null);
  return { result, gained };
}

function move(direction) {
  if (gameOver) return;

  const previous = grid.map(tile => tile ? { ...tile } : null);
  let changed = false;
  let gained = 0;

  for (let lineIndex = 0; lineIndex < SIZE; lineIndex++) {
    const indexes = [];

    for (let step = 0; step < SIZE; step++) {
      if (direction === "left") indexes.push(lineIndex * SIZE + step);
      if (direction === "right") indexes.push(lineIndex * SIZE + (SIZE - 1 - step));
      if (direction === "up") indexes.push(step * SIZE + lineIndex);
      if (direction === "down") indexes.push((SIZE - 1 - step) * SIZE + lineIndex);
    }

    const line = indexes.map(index => grid[index]);
    const { result, gained: lineScore } = slideLine(line);
    gained += lineScore;

    indexes.forEach((index, i) => {
      grid[index] = result[i];
    });
  }

  changed = grid.some((tile, i) =>
    (tile?.id ?? null) !== (previous[i]?.id ?? null)
  );

  if (!changed) return;

  score += gained;
  addRandomTile();
  render();

  if (!won && grid.some(tile => tile && tile.level === schools.length)) {
    won = true;
    message.textContent = "YOU GOT NDP! 💗";
  } else {
    message.textContent = "";
  }

  if (!canMove()) {
    gameOver = true;
    message.textContent = won ? "YOU GOT NDP! 💗" : "Game over! Try again!";
  }
}

function canMove() {
  if (grid.some(tile => !tile)) return true;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const tile = grid[r * SIZE + c];
      if (c < SIZE - 1 && tile.level === grid[r * SIZE + c + 1].level) return true;
      if (r < SIZE - 1 && tile.level === grid[(r + 1) * SIZE + c].level) return true;
    }
  }
  return false;
}

function newGame() {
  grid = Array(SIZE * SIZE).fill(null);
  score = 0;
  nextId = 1;
  gameOver = false;
  won = false;
  tileElements.forEach(el => el.remove());
  tileElements.clear();
  message.textContent = "";
  addRandomTile();
  addRandomTile();
  render();
}

document.addEventListener("keydown", event => {
  const directions = {
    ArrowLeft: "left",
    ArrowRight: "right",
    ArrowUp: "up",
    ArrowDown: "down"
  };

  if (directions[event.key]) {
    event.preventDefault();
    move(directions[event.key]);
  }
});

let touchStartX = 0;
let touchStartY = 0;

board.addEventListener("touchstart", event => {
  const touch = event.changedTouches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
}, { passive: true });

board.addEventListener("touchend", event => {
  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? "right" : "left");
  } else {
    move(dy > 0 ? "down" : "up");
  }
}, { passive: true });

document.getElementById("restart").addEventListener("click", newGame);

window.addEventListener("resize", () => {
  grid.forEach((tile, index) => {
    if (tile) {
      const el = tileElements.get(tile.id);
      if (el) {
        el.style.transition = "none";
        positionTile(el, index);
      }
    }
  });
});

newGame();
</script>
</body>
</html>
