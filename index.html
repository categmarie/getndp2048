
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GET NDP</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 12px;
  background: #fff0f6;
  color: #702050;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 4px 0;
  color: #b83280;
  font-size: clamp(44px, 10vw, 68px);
  font-weight: 900;
  letter-spacing: -3px;
}

.subtitle { margin: 8px auto 18px; font-size: 14px; }

.top {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 15px auto;
}

.score-box {
  padding: 10px 20px;
  border-radius: 10px;
  background: #b83280;
  color: white;
  font-weight: bold;
}

.score-label {
  display: block;
  font-size: 11px;
  margin-bottom: 4px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  background: #702050;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.game {
  position: relative;
  width: min(94vw, 440px);
  aspect-ratio: 1;
  margin: 18px auto;
  padding: 9px;
  background: #dca5c2;
  border-radius: 16px;
  touch-action: none;
  overflow: hidden;
}

.grid, .tiles {
  position: absolute;
  inset: 9px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 8px;
}

.empty {
  background: #f8d6e7;
  border-radius: 9px;
}

.tiles { pointer-events: none; }

.tile {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
  border-radius: 9px;
  background: white;
  overflow: hidden;
  will-change: transform;
  transition: transform 140ms ease-in-out;
}

.tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.tile.spawn {
  animation: spawn 140ms ease-out;
}

.tile.merge {
  animation: merge 150ms ease-out;
}

.message {
  min-height: 24px;
  margin: 12px auto;
  font-size: 14px;
  font-weight: bold;
}

.instructions {
  max-width: 360px;
  margin: 16px auto;
  font-size: 13px;
  line-height: 1.5;
}

.creator {
  margin-top: 30px;
  color: #a66a8c;
  font-size: 10px;
  letter-spacing: .5px;
}

@keyframes spawn {
  from { scale: .65; opacity: .5; }
  to { scale: 1; opacity: 1; }
}

@keyframes merge {
  50% { scale: 1.12; }
  100% { scale: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .tile { transition-duration: 0ms; }
}
</style>
</head>
<body>

<h1>GET NDP</h1>
<p class="subtitle">Combine other high schools to reach the almighty NDP!</p>

<div class="top">
  <div class="score-box">
    <span class="score-label">SCORE</span>
    <span id="score">0</span>
  </div>
  <button id="restart">New Game</button>
</div>

<div id="game" class="game" aria-label="GET NDP game board">
  <div class="grid" id="grid"></div>
  <div class="tiles" id="tiles"></div>
</div>

<div id="message" class="message">Use your arrow keys to play!</div>

<p class="instructions">
  Use your arrow keys or swipe to move the photos.
  Matching schools combine into the next school.
  Keep going until you reach NDP!
</p>

<div class="creator">Created by Cate Graham</div>

<script>
const schools = [
  { value: 2, logo: "images_sus.jpg" },
  { value: 4, logo: "ICS-Logo.jpg" },
  { value: 8, logo: "images_spn.png" },
  { value: 16, logo: "images_maryvale.jpg" },
  { value: 32, logo: "images.jpg" },
  { value: 64, logo: "bryn-mawr-school.jpg" },
  { value: 128, logo: "Rpcs_logo2.png" },
  { value: 256, logo: "The_John_Carroll_School_Logo.jpeg" },
  { value: 512, logo: "MHS_Seal_ONLY.jpg" },
  { value: 1024, logo: "Mount_de_Sales_Academy_Logo.png" },
  { value: 2048, logo: "images_ndp.jpg" }
];

const SIZE = 4;
const GAP = 8;
const game = document.getElementById("game");
const grid = document.getElementById("grid");
const layer = document.getElementById("tiles");
const scoreEl = document.getElementById("score");
const message = document.getElementById("message");

let board = [];
let score = 0;
let nextId = 1;
let busy = false;
let won = false;
let gameOver = false;
let tileElements = new Map();
let moveTimer;

for (let i = 0; i < 16; i++) {
  const cell = document.createElement("div");
  cell.className = "empty";
  grid.appendChild(cell);
}

function dimensions() {
  const width = layer.clientWidth;
  const tileSize = (width - GAP * 3) / SIZE;
  return { tileSize, gap: GAP };
}

function positionTile(el, index, animate = true) {
  const { tileSize, gap } = dimensions();
  const row = Math.floor(index / SIZE);
  const col = index % SIZE;

  el.style.width = tileSize + "px";
  el.style.height = tileSize + "px";
  el.style.transition = animate ? "transform 140ms ease-in-out" : "none";
  el.style.transform =
    `translate(${col * (tileSize + gap)}px, ${row * (tileSize + gap)}px)`;
}

function createTile(tile) {
  const school = schools.find(s => s.value === tile.value);
  const el = document.createElement("div");
  el.className = "tile spawn";
  el.dataset.id = tile.id;

  const img = document.createElement("img");
  img.src = "logos/" + school.logo;
  img.alt = "";
  img.draggable = false;
  img.onerror = () => { img.style.visibility = "hidden"; };

  el.appendChild(img);
  layer.appendChild(el);
  tileElements.set(tile.id, el);
  return el;
}

function render(animate = true, mergedIds = []) {
  const activeIds = new Set(board.filter(Boolean).map(t => t.id));

  for (const [id, el] of tileElements) {
    if (!activeIds.has(id)) {
      el.remove();
      tileElements.delete(id);
    }
  }

  board.forEach((tile, index) => {
    if (!tile) return;

    let el = tileElements.get(tile.id);
    if (!el) el = createTile(tile);

    positionTile(el, index, animate);

    if (mergedIds.includes(tile.id)) {
      el.classList.remove("merge");
      void el.offsetWidth;
      el.classList.add("merge");
    }
  });

  scoreEl.textContent = score;
}

function addTile() {
  const empty = board
    .map((tile, i) => tile === null ? i : -1)
    .filter(i => i !== -1);

  if (!empty.length) return;

  const index = empty[Math.floor(Math.random() * empty.length)];
  board[index] = {
    id: nextId++,
    value: Math.random() < .9 ? 2 : 4
  };
}

function newGame() {
  clearTimeout(moveTimer);
  board = Array(16).fill(null);
  score = 0;
  nextId = 1;
  busy = false;
  won = false;
  gameOver = false;
  tileElements.forEach(el => el.remove());
  tileElements.clear();
  message.textContent = "Use your arrow keys to play!";
  addTile();
  addTile();
  render(false);
}

function slideLine(line) {
  const items = line.filter(Boolean);
  const result = [];
  const mergedIds = [];

  for (let i = 0; i < items.length; i++) {
    if (items[i + 1] &&
        items[i].value === items[i + 1].value &&
        items[i].value < 2048) {
      const merged = {
        id: nextId++,
        value: items[i].value * 2
      };

      result.push(merged);
      mergedIds.push(merged.id);
      score += merged.value;
      i++;
    } else {
      result.push(items[i]);
    }
  }

  while (result.length < SIZE) result.push(null);
  return { result, mergedIds };
}

function canMove() {
  for (let i = 0; i < 16; i++) {
    if (!board[i]) return true;
    if (i % 4 < 3 && board[i].value === board[i + 1]?.value) return true;
    if (i < 12 && board[i].value === board[i + 4]?.value) return true;
  }
  return false;
}

function move(direction) {
  if (busy || gameOver || won) return;

  const previous = board.map(t => t ? t.id + ":" + t.value : ".");
  const next = Array(16).fill(null);
  const mergedIds = [];

  for (let lineIndex = 0; lineIndex < SIZE; lineIndex++) {
    const line = [];

    for (let p = 0; p < SIZE; p++) {
      let index;
      if (direction === "left") index = lineIndex * SIZE + p;
      if (direction === "right") index = lineIndex * SIZE + (SIZE - 1 - p);
      if (direction === "up") index = p * SIZE + lineIndex;
      if (direction === "down") index = (SIZE - 1 - p) * SIZE + lineIndex;
      line.push(board[index]);
    }

    const moved = slideLine(line);
    mergedIds.push(...moved.mergedIds);

    for (let p = 0; p < SIZE; p++) {
      let index;
      if (direction === "left") index = lineIndex * SIZE + p;
      if (direction === "right") index = lineIndex * SIZE + (SIZE - 1 - p);
      if (direction === "up") index = p * SIZE + lineIndex;
      if (direction === "down") index = (SIZE - 1 - p) * SIZE + lineIndex;
      next[index] = moved.result[p];
    }
  }

  if (next.map(t => t ? t.id + ":" + t.value : ".").join(",") === previous.join(",")) {
    return;
  }

  board = next;
  busy = true;
  render(true, mergedIds);

  moveTimer = setTimeout(() => {
    if (board.some(t => t && t.value === 2048)) {
      won = true;
      message.textContent = "You reached the almighty NDP!";
    } else {
      addTile();
      if (!canMove()) {
        gameOver = true;
        message.textContent = "No moves left! Start a new game.";
      }
    }

    render(true);
    busy = false;
  }, 145);
}

document.addEventListener("keydown", event => {
  const directions = {
    ArrowLeft: "left",
    ArrowRight: "right",
    ArrowUp: "up",
    ArrowDown: "down"
  };

  if (directions[event.key]) {
    event.preventDefault();
    move(directions[event.key]);
  }
});

let startX = 0;
let startY = 0;

game.addEventListener("touchstart", event => {
  startX = event.changedTouches[0].clientX;
  startY = event.changedTouches[0].clientY;
}, { passive: true });

game.addEventListener("touchend", event => {
  const dx = event.changedTouches[0].clientX - startX;
  const dy = event.changedTouches[0].clientY - startY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? "right" : "left");
  } else {
    move(dy > 0 ? "down" : "up");
  }
}, { passive: true });

document.getElementById("restart").addEventListener("click", newGame);

window.addEventListener("resize", () => render(false));

newGame();
</script>
</body>
</html>
