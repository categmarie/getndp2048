
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GET NDP</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 12px;
  background: #fff0f6;
  color: #702050;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 4px 0;
  color: #b83280;
  font-size: clamp(44px, 10vw, 68px);
  font-weight: 900;
  letter-spacing: -3px;
}

.subtitle {
  margin: 8px auto 18px;
  font-size: 14px;
}

.top {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 15px auto;
}

.score-box {
  padding: 10px 20px;
  border-radius: 10px;
  background: #b83280;
  color: white;
  font-weight: bold;
}

.score-label {
  display: block;
  font-size: 11px;
  margin-bottom: 4px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  background: #702050;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.game {
  width: min(94vw, 440px);
  margin: 18px auto;
  padding: 9px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  background: #dca5c2;
  border-radius: 16px;
  touch-action: none;
}

.cell {
  min-width: 0;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 9px;
  background: #f8d6e7;
}

.tile {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px;
  border-radius: 9px;
  background: white;
  animation: appear 0.12s ease-out;
}

.tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.empty {
  background: #f8d6e7;
}

.message {
  min-height: 24px;
  margin: 12px auto;
  font-size: 14px;
  font-weight: bold;
}

.instructions {
  max-width: 360px;
  margin: 16px auto;
  font-size: 13px;
  line-height: 1.5;
}

.creator {
  margin-top: 30px;
  color: #a66a8c;
  font-size: 10px;
  letter-spacing: 0.5px;
}

@keyframes appear {
  from { transform: scale(0.92); }
  to { transform: scale(1); }
}
</style>
</head>

<body>

<h1>GET NDP</h1>
<p class="subtitle">
  Combine other high schools to reach the almighty NDP!
</p>

<div class="top">
  <div class="score-box">
    <span class="score-label">SCORE</span>
    <span id="score">0</span>
  </div>
  <button onclick="newGame()">New Game</button>
</div>

<div id="game" class="game"></div>
<div id="message" class="message">Use your arrow keys to play!</div>

<p class="instructions">
  Use your arrow keys or swipe to move the photos.
  Matching schools combine into the next school.
  Keep going until you reach NDP!
</p>

<div class="creator">Created by Cate Graham</div>

<script>
const schools = [
  { value: 2, logo: "images_sus.jpg" },
  { value: 4, logo: "ICS-Logo.jpg" },
  { value: 8, logo: "images_spn.png" },
  { value: 16, logo: "images_maryvale.jpg" },
  { value: 32, logo: "images.jpg" },
  { value: 64, logo: "bryn-mawr-school.jpg" },
  { value: 128, logo: "Rpcs_logo2.png" },
  { value: 256, logo: "The_John_Carroll_School_Logo.jpeg" },
  { value: 512, logo: "MHS_Seal_ONLY.jpg" },
  { value: 1024, logo: "Mount_de_Sales_Academy_Logo.png" },
  { value: 2048, logo: "images_ndp.jpg" }
];

const SIZE = 4;
let board = [];
let score = 0;
let gameOver = false;

const gameEl = document.getElementById("game");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");

function newGame() {
  board = Array(16).fill(0);
  score = 0;
  gameOver = false;
  messageEl.textContent = "Use your arrow keys to play!";
  addTile();
  addTile();
  render();
}

function addTile() {
  const empty = board
    .map((value, index) => value === 0 ? index : -1)
    .filter(index => index !== -1);

  if (!empty.length) return;

  const index = empty[Math.floor(Math.random() * empty.length)];
  board[index] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  gameEl.innerHTML = "";

  board.forEach(value => {
    const cell = document.createElement("div");
    cell.className = "cell";

    if (value === 0) {
      cell.classList.add("empty");
    } else {
      const school = schools.find(item => item.value === value);
      const tile = document.createElement("div");
      tile.className = "tile";

      const img = document.createElement("img");
      img.src = "logos/" + school.logo;
      img.alt = "";
      img.draggable = false;

      img.onerror = () => {
        img.style.visibility = "hidden";
        cell.style.background = "#ffffff";
      };

      tile.appendChild(img);
      cell.appendChild(tile);
    }

    gameEl.appendChild(cell);
  });

  scoreEl.textContent = score;

  if (board.includes(2048)) {
    messageEl.textContent = "You reached NDP!";
  } else if (gameOver) {
    messageEl.textContent = "No moves left! Start a new game.";
  }
}

function slideLine(line) {
  const values = line.filter(value => value !== 0);
  const result = [];

  for (let i = 0; i < values.length; i++) {
    if (values[i] === values[i + 1] && values[i] < 2048) {
      const merged = values[i] * 2;
      result.push(merged);
      score += merged;
      i++;
    } else {
      result.push(values[i]);
    }
  }

  while (result.length < SIZE) result.push(0);
  return result;
}

function move(direction) {
  if (gameOver || board.includes(2048)) return;

  const previous = board.join(",");
  const next = Array(16).fill(0);

  for (let lineIndex = 0; lineIndex < SIZE; lineIndex++) {
    let line = [];

    for (let position = 0; position < SIZE; position++) {
      let index;

      if (direction === "left")
        index = lineIndex * SIZE + position;
      if (direction === "right")
        index = lineIndex * SIZE + (SIZE - 1 - position);
      if (direction === "up")
        index = position * SIZE + lineIndex;
      if (direction === "down")
        index = (SIZE - 1 - position) * SIZE + lineIndex;

      line.push(board[index]);
    }

    const moved = slideLine(line);

    for (let position = 0; position < SIZE; position++) {
      let index;

      if (direction === "left")
        index = lineIndex * SIZE + position;
      if (direction === "right")
        index = lineIndex * SIZE + (SIZE - 1 - position);
      if (direction === "up")
        index = position * SIZE + lineIndex;
      if (direction === "down")
        index = (SIZE - 1 - position) * SIZE + lineIndex;

      next[index] = moved[position];
    }
  }

  board = next;

  if (board.join(",") !== previous) {
    addTile();
    render();

    if (!board.includes(2048) && !canMove()) {
      gameOver = true;
      render();
    }
  }
}

function canMove() {
  for (let i = 0; i < 16; i++) {
    if (board[i] === 0) return true;
    if (i % 4 < 3 && board[i] === board[i + 1]) return true;
    if (i < 12 && board[i] === board[i + 4]) return true;
  }
  return false;
}

document.addEventListener("keydown", event => {
  const keys = {
    ArrowLeft: "left",
    ArrowRight: "right",
    ArrowUp: "up",
    ArrowDown: "down"
  };

  if (keys[event.key]) {
    event.preventDefault();
    move(keys[event.key]);
  }
});

let startX = 0;
let startY = 0;

gameEl.addEventListener("touchstart", event => {
  startX = event.changedTouches[0].clientX;
  startY = event.changedTouches[0].clientY;
}, { passive: true });

gameEl.addEventListener("touchend", event => {
  const dx = event.changedTouches[0].clientX - startX;
  const dy = event.changedTouches[0].clientY - startY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? "right" : "left");
  } else {
    move(dy > 0 ? "down" : "up");
  }
}, { passive: true });

newGame();
</script>
</body>
</html>
