
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GET NDP</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px 12px;min-height:100vh;
  background:#fce7f0;color:#422638;
  font-family:Arial,sans-serif;text-align:center
}
h1{font-size:clamp(34px,8vw,48px);color:#b52d69;margin:8px 0}
.subtitle{margin:0 0 20px}
.stats{display:flex;justify-content:center;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.stat{background:white;padding:10px 16px;border-radius:10px;font-weight:bold}
button{border:0;border-radius:9px;padding:11px 16px;background:#b52d69;color:white;font-weight:bold;cursor:pointer}
#board{
  width:min(94vw,440px);aspect-ratio:1;margin:auto;
  background:#d8a7bf;padding:8px;border-radius:14px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(4,minmax(0,1fr));gap:7px;
  touch-action:none
}
.cell{
  min-width:0;min-height:0;border-radius:9px;
  background:#f9eaf1;display:flex;align-items:center;
  justify-content:center;flex-direction:column;
  overflow:hidden;padding:3px
}
.cell[data-v="2"]{background:#fff6df}
.cell[data-v="4"]{background:#f7d9e8}
.cell[data-v="8"]{background:#edc1d9}
.cell[data-v="16"]{background:#dc9fc3}
.cell[data-v="32"]{background:#c878a6;color:white}
.cell[data-v="64"]{background:#ad568a;color:white}
.cell[data-v="128"]{background:#82416f;color:white}
.cell[data-v="256"]{background:#b52d69;color:white;box-shadow:inset 0 0 0 3px white}
.logo{
  width:60%;height:48%;object-fit:contain;
  margin-bottom:2px
}
.emoji{font-size:clamp(16px,4.5vw,27px);line-height:1.05}
.school{font-size:clamp(7px,2.1vw,11px);font-weight:bold;line-height:1.1;margin-top:3px;overflow-wrap:anywhere}
.cell[data-v="0"]{background:#f5dce7}
#message{min-height:24px;color:#a32662;font-weight:bold;margin:16px 0 5px}
.help{max-width:440px;margin:12px auto;line-height:1.5;font-size:14px}
</style>
</head>
<body>
<h1>GET NDP 💗</h1>
<p class="subtitle">combine other schools to reach the almighty NDP!</p>

<div class="stats">
  <div class="stat">SCORE: <span id="score">0</span></div>
  <div class="stat">BEST: <span id="best">0</span></div>
  <button onclick="restart()">New Game ↻</button>
</div>

<div id="board" aria-label="2048 game board"></div>
<p id="message"></p>
<div class="help">
  Use your arrow keys or swipe to move the tiles.<br>
  Match two schools to unlock the next school!<br>
  <strong>Can you reach the almighty NDP? 🐆</strong>
</div>

<script>
const schools = [
  {v:2,   name:"ST. URSULA'S",          emoji:"🐻", img:"logos/st-ursulas.png"},
  {v:4,   name:"ICS",                   emoji:"🦅", img:"logos/ics.png"},
  {v:8,   name:"ST. PHILIP NERI",       emoji:"🐾", img:"logos/st-philip-neri.png"},
  {v:16,  name:"MARYVALE",              emoji:"🦁", img:"logos/maryvale.png"},
  {v:32,  name:"ST. PAUL'S SCHOOL FOR GIRLS", emoji:"🪽", img:"logos/st-pauls.png"},
  {v:64,  name:"MOUNT DE SALES",        emoji:"⭐", img:"logos/mount-de-sales.png"},
  {v:128, name:"LOYOLA BLAKEFIELD",     emoji:"⚔️", img:"logos/loyola.png"},
  {v:256, name:"NDP",                   emoji:"🐆", img:"logos/ndp.png"}
];

let board = [];
let score = 0;
let best = 0;
let over = false;
let won = false;

try {
  best = Number(localStorage.getItem("getndp-best")) || 0;
} catch(e) {}

const $ = id => document.getElementById(id);

function schoolFor(value) {
  return schools.find(s => s.v === value);
}

function draw() {
  const area = $("board");
  area.innerHTML = "";

  board.forEach(value => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.v = value;

    if (value) {
      const school = schoolFor(value);

      const img = document.createElement("img");
      img.className = "logo";
      img.src = school.img;
      img.alt = school.name + " logo";
      img.onerror = function() {
        this.style.display = "none";
      };

      const emoji = document.createElement("div");
      emoji.className = "emoji";
      emoji.textContent = school.emoji;

      const name = document.createElement("div");
      name.className = "school";
      name.textContent = school.name;

      cell.append(img, emoji, name);
    }

    area.appendChild(cell);
  });

  $("score").textContent = score;
  $("best").textContent = best;
}

function addTile() {
  const empty = board
    .map((value, index) => value === 0 ? index : -1)
    .filter(index => index !== -1);

  if (!empty.length) return;

  const index = empty[Math.floor(Math.random() * empty.length)];
  board[index] = Math.random() < 0.9 ? 2 : 4;
}

function restart() {
  board = Array(16).fill(0);
  score = 0;
  over = false;
  won = false;
  $("message").textContent = "";
  addTile();
  addTile();
  draw();
}

function canMove() {
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const i = r * 4 + c;
      if (c < 3 && board[i] === board[i + 1]) return true;
      if (r < 3 && board[i] === board[i + 4]) return true;
    }
  }
  return false;
}

function move(direction) {
  if (over || won) return;

  let changed = false;

  for (let line = 0; line < 4; line++) {
    let indexes = [];

    for (let j = 0; j < 4; j++) {
      let r, c;

      if (direction === "left" || direction === "right") {
        r = line;
        c = direction === "left" ? j : 3 - j;
      } else {
        c = line;
        r = direction === "up" ? j : 3 - j;
      }

      indexes.push(r * 4 + c);
    }

    const values = indexes.map(i => board[i]).filter(v => v !== 0);
    const result = [];

    for (let j = 0; j < values.length; j++) {
      if (
        values[j] === values[j + 1] &&
        values[j] < 256
      ) {
        const merged = values[j] * 2;
        result.push(merged);
        score += merged;
        j++;
      } else {
        result.push(values[j]);
      }
    }

    while (result.length < 4) result.push(0);

    indexes.forEach((index, j) => {
      if (board[index] !== result[j]) changed = true;
      board[index] = result[j];
    });
  }

  if (!changed) return;

  addTile();

  if (score > best) {
    best = score;
    try {
      localStorage.setItem("getndp-best", best);
    } catch(e) {}
  }

  if (board.includes(256)) {
    won = true;
    $("message").textContent =
      "THE ALMIGHTY NDP!! 🐆💗 YOU WON!";
  }

  draw();

  if (!won && !board.includes(0) && !canMove()) {
    over = true;
    $("message").textContent = "Game over! Try again 💗";
  }
}

document.addEventListener("keydown", event => {
  const directions = {
    ArrowLeft:"left",
    ArrowRight:"right",
    ArrowUp:"up",
    ArrowDown:"down"
  };

  if (directions[event.key]) {
    event.preventDefault();
    move(directions[event.key]);
  }
});

let startX = 0, startY = 0;

$("board").addEventListener("touchstart", event => {
  startX = event.changedTouches[0].clientX;
  startY = event.changedTouches[0].clientY;
}, {passive:true});

$("board").addEventListener("touchend", event => {
  const dx = event.changedTouches[0].clientX - startX;
  const dy = event.changedTouches[0].clientY - startY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? "right" : "left");
  } else {
    move(dy > 0 ? "down" : "up");
  }
}, {passive:true});

restart();
</script>
</body>
</html>
